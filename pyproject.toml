[project]
name = "fresco"
version = "0.1.0"
description = "Extracts door hardware sets from construction specification PDFs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi[standard]>=0.142.2",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=1.28.2",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
fresco = "fresco.main:cli"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fresco"]
